# Centralized organization security scans; pinned reusable workflow and actions.
name: Organization security
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    permissions:
      actions: write
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: securelyprogramming/security-workflows/.github/workflows/security-baseline.yml@392e3b93a2fe1a935feafcb66e53a9c3cbd1edda
    with:
      enable_secrets: true
      enable_vuln: true
      enable_config: true
      enable_actions: true

  codeql:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, java-kotlin, python]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}

  security-results:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: trivy-*
          path: security-reports
          merge-multiple: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: security-reports/trivy-vulnerabilities.sarif
          category: Trivy
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: security-reports/trivy-misconfig.sarif
          category: trivy-misconfiguration

  security-summary:
    name: security / Security summary
    needs: [security, codeql, security-results]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every security control
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          sys.exit(0 if all(job['result'] == 'success' for job in results.values()) else 1)
          PYTHON
