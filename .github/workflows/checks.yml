name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Check protocol, browser and shared models
        run: |
          python3 -m unittest discover -s broker -p 'test*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test test-*.cjs web/test-*.cjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-runtime.txt
      - run: python scripts/prepare-runtime.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :boogie:lintDebug --console=plain
        working-directory: android
      # No binary publication: corresponding WASM core source provenance is still being resolved.

  native-guest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    defaults:
      run:
        working-directory: native-guest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libasound2-dev libpulse-dev libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libwayland-dev libdbus-1-dev
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-linux-x86_64.lock
      - run: bash build-sdl3.sh
      - run: python -m unittest discover -p 'test_*.py'
      - run: python boogie_guest.py --self-test
