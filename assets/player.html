<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boogie Woogie player</title>
<style>
html,body{margin:0;background:#07150f;color:#dcffe8;font:16px sans-serif;height:100%;overflow:hidden}#game,#guest{width:100%;height:100%}#guest{position:relative}#remoteVideo{width:100%;height:100%;object-fit:contain;background:black}button{background:#153f2ee8;color:#effff4;border:2px solid #73e4a5;border-radius:12px;min-height:44px;font-size:15px;touch-action:none}#status{display:none}#guestTools{flex-wrap:wrap;position:absolute;top:6px;right:6px;left:6px;z-index:4;display:flex;gap:6px;align-items:start}#guestTools button{padding:6px 10px}#layoutNotice{font-size:11px;max-width:150px;color:#b9e5ca}#touchBoard{position:absolute;inset:145px 6px 6px;touch-action:none;pointer-events:none}#touchBoard button{position:absolute;width:clamp(42px,10vw,62px);height:clamp(42px,10vw,62px);min-height:0;border-radius:50%;font-size:19px;padding:0;pointer-events:auto;user-select:none;-webkit-user-select:none}#touchBoard button.direction{border-radius:10px}#touchBoard button.utility{font-size:10px;background:#183a32d9}#touchBoard.editing{top:145px;outline:2px dashed #8fdeb4;background:repeating-linear-gradient(0deg,#07150f70,#07150f70 24px,#1c533370 25px)}#touchBoard.editing button{border-style:dashed;cursor:move}#videoPanel{position:absolute;z-index:8;top:4px;left:4px;right:4px;background:#09291bf7;border:1px solid #73e4a5;padding:10px;border-radius:10px;font-size:12px}#videoPanel[hidden],#videoFps[hidden]{display:none}#videoPanel p{margin:8px 0}#videoPanel .actions{display:flex;gap:5px}#videoPanel button{padding:4px 8px;font-size:12px}#videoPanel button[aria-pressed=true]{background:#2c8656}#videoFps{position:absolute;z-index:4;top:100px;left:8px;background:#082013e8;padding:5px;font-size:11px;pointer-events:none}#layoutPanel{position:absolute;z-index:5;top:4px;left:4px;right:4px;background:#09291bf2;border:1px solid #73e4a5;padding:7px;border-radius:10px}#layoutPanel[hidden]{display:none}#layoutPanel p{margin:0 0 6px;font-size:12px}#layoutPanel .actions{display:flex;gap:5px;flex-wrap:wrap}#layoutPanel button{font-size:12px;padding:3px 8px}#layoutPanel button:disabled{opacity:.45}.editing #touchBoard{top:120px}
</style>
<link rel="stylesheet" href="backdrop.css">
<div id="status">Private LAN test · waiting</div><div id="game"></div>
<div id="guest" hidden><video id="remoteVideo" playsinline autoplay></video>
<div id="guestTools"><button id="appearance">Appearance</button><button id="editLayout">Edit layout</button><button id="videoQuality">Video quality</button><button id="enableAudio">Enable audio</button><span id="layoutNotice"></span></div>
<div id="layoutPanel" hidden><p id="layoutMessage"></p><div class="actions"><button id="saveGameLayout">Save for this game</button><button id="saveDefaultLayout">Set default for all games</button><button id="resetLayout">Reset</button><button id="cancelLayout">Cancel</button></div></div>
<div id="videoPanel" hidden><strong>Video quality</strong><p id="videoQualityStatus">Only your stream changes.</p><div class="actions"><button data-profile="smooth">Smooth</button><button data-profile="balanced">Balanced</button><button data-profile="sharp">Sharp</button></div><p>Smooth: up to 480px · Balanced: up to 720px · Sharp: source detail. All target up to 30 FPS.</p><label><input id="showVideoFps" type="checkbox"> Show decoded FPS</label><button id="closeVideoQuality">Done</button></div><div id="videoFps" hidden></div><div id="touchBoard">
<button class="direction" data-control="up" data-action="4" aria-label="Up">↑</button><button class="direction" data-control="left" data-action="6" aria-label="Left">←</button><button class="direction" data-control="right" data-action="7" aria-label="Right">→</button><button class="direction" data-control="down" data-action="5" aria-label="Down">↓</button>
<button data-control="a" data-action="8" aria-label="A Jump">A</button><button data-control="b" data-action="0" aria-label="B Run">B</button><button data-control="x" data-action="0" aria-label="X Run">X</button><button data-control="y" data-action="8" aria-label="Y Jump">Y</button>
<button class="utility" data-control="start" data-action="3">Start</button><button class="utility" data-control="select" data-action="2">Select</button></div></div>
<script src="native-gamepad.js"></script><script src="controller-overlay.js"></script><script src="state-store.js"></script><script src="layout-model.js"></script><script src="layout-editor.js"></script><script src="video-model.js"></script><script src="video-quality.js"></script><script src="backdrop-model.js"></script><script src="viewport-capture.js"></script><script src="remote.js"></script><script src="backdrop.js"></script><script src="player-settings.js"></script><script src="player.js"></script></html>
